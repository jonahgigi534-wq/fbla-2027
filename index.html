<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>House of Pies Ordering</title>
    <meta
      name="description"
      content="Digital ordering system for House of Pies. Browse the menu, place and manage orders, and run sales reports."
    />
    <link rel="icon" href="assets/img/logo.webp" />
    <link rel="stylesheet" href="src/css/fonts.css" />
    <link rel="stylesheet" href="src/css/tokens.css" />
    <link rel="stylesheet" href="src/css/base.css" />
    <link rel="stylesheet" href="src/css/layout.css" />
    <link rel="stylesheet" href="src/css/components.css" />
    <link rel="stylesheet" href="src/css/screens.css" />
    <link rel="stylesheet" href="src/css/brand.css" />
    <link rel="stylesheet" href="src/css/print.css" media="print" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="app-header">
      <div class="app-header__inner">
        <a class="app-header__logo" href="#/home" aria-label="House of Pies ordering, home">
          <img src="assets/img/logo.webp" alt="House of Pies" width="160" height="40" />
        </a>
        <nav class="app-nav" id="app-nav" aria-label="Main"></nav>
      </div>
    </header>

    <main class="app-main" id="main" tabindex="-1"></main>

    <footer class="app-footer">
      <div class="app-footer__inner">
        <p>
          An independent student project for an FBLA Introduction to Programming event. Not
          affiliated with or endorsed by House of Pies.
        </p>
        <p><a href="#/help">Help center</a></p>

    <script type="module" src="src/js/main.js"></script>
